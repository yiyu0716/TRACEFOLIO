name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
    branches: ["codex/desktop-cloud-foundation"]
    paths:
      - "desktop/**"
      - "scripts/**"
      - "src/**"
      - "prisma/**"
      - "package*.json"
      - "next.config.ts"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: file:./build.db
      - run: npm run desktop:prepare
        env:
          TRACEFOLIO_DESKTOP_CLOUD_URL: ${{ vars.TRACEFOLIO_DESKTOP_CLOUD_URL }}
          TRACEFOLIO_DESKTOP_REQUIRE_LICENSE: ${{ vars.TRACEFOLIO_DESKTOP_REQUIRE_LICENSE }}
      - run: node scripts/smoke-desktop.mjs
      - run: npx electron-builder --config desktop/electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/check-packaged-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: TRACEFOLIO-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            outputs/desktop/*.dmg
            outputs/desktop/*.zip
            outputs/desktop/*.exe
          if-no-files-found: error
