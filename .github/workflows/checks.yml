name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix services/cloud
      - run: npm run setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run cloud:typecheck
      - run: npm test
      - run: npm run runtime:check
      - run: node scripts/smoke-platform.mjs
      - run: npm run build
